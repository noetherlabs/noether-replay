[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "noether-ao-replay"
version = "0.1.0"
description = "Offline reconstruction and evidence qualification for adaptive-optics telemetry"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Noether Labs"}]
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
aot = ["aotpy==3.2.1"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
noether-replay = "noether_replay.cli:main"

[project.urls]
Repository = "https://github.com/noetherlabs/noether-replay"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
